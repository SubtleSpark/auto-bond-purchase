name: Auto Bond Purchase

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Pull LFS files
        run: git lfs pull

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync

      - name: Install Playwright browser
        run: uv run playwright install --with-deps chromium

      - name: Mask individual credentials
        env:
          USERS: ${{ secrets.USERS }}
        shell: bash
        run: |
          python - <<'PY'
          import os

          for pair in os.environ.get("USERS", "").split(","):
              if ":" not in pair:
                  continue
              account, password = pair.split(":", 1)
              for value in (account.strip(), password.strip()):
                  if value:
                      print(f"::add-mask::{value}")
          PY

      - name: Run script
        env:
          USERS: ${{ secrets.USERS }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          BROWSER: chromium
          HEADLESS: "true"
        run: uv run python main.py
